    <div class="products-page">
      <!-- Page Hero -->

        <div class="section-label" style="justify-content:center">Our
          Collection</div>
        <h1 class="section-title" style="font-size:clamp(3rem,7vw,6rem)">Shop
          All Tees</h1>
        <p style="color:var(--text-muted);font-size:0.95rem;margin-top:0.5rem">
          Premium cotton. Bold prints. Fits for every vibe.
        </p>
      </div>

      <!-- Toolbar -->
      <div class="products-toolbar">
        <div class="container">
          <div class="toolbar-inner">
            <!-- Search -->
            <div class="search-bar"
              style="flex:1;min-width:200px;max-width:320px">
              <span class="search-bar-icon">🔍</span>
              <input class="form-input" id="product-search" type="text"
                placeholder="Search products..." style="padding-left:2.5rem" />
            </div>
            <!-- Filter Chips -->
            <div class="filter-chips" style="flex:1">
              <button class="filter-chip active"
                data-category="all">All</button>
              <button class="filter-chip"
                data-category="graphic">Graphic</button>
              <button class="filter-chip"
                data-category="oversized">Oversized</button>
              <button class="filter-chip" data-category="basics">Basics</button>
              <button class="filter-chip" data-category="polo">Polo</button>
              <button class="filter-chip" data-category="custom">Custom</button>
            </div>
            <span class="products-count" id="products-count">Loading...</span>
          </div>
        </div>
      </div>

      <!-- Products Grid -->
      <div class="section" style="padding-top:2.5rem">
        <div class="container">
          <div class="products-grid" id="products-grid">
            <!-- Rendered by products.js -->
          </div>
        </div>
      </div>
    </div>

                  x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
            </a>
            <a href="#" class="social-icon" title="Facebook">

    <script>
  // Handle URL category param
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const cat = params.get('cat');
    if (cat) {
      const chip = document.querySelector(`.filter-chip[data-category="${cat}"]`);
      if (chip) setTimeout(() => chip.click(), 150);
    }
  });
</script>
