<!DOCTYPE html>
<html lang="en" data-theme="dark">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
      content="Login or create your ZENTRA account to request products and track your orders." />
    <link rel="icon" type="image/png" href="logo.png" />
    <title>Login / Sign Up — ZENTRA</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/preloader.css" />
    <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 1.5rem 3rem;
      position: relative;
      overflow: hidden;
    }

    .auth-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .auth-bg::before {
      content: '';
      position: absolute;
      top: -200px;
      left: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(200, 169, 110, 0.07) 0%, transparent 70%);
      border-radius: 50%;
    }

    .auth-bg::after {
      content: '';
      position: absolute;
      bottom: -200px;
      right: -200px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(100, 80, 200, 0.05) 0%, transparent 70%);
      border-radius: 50%;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border-2);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
      box-shadow: var(--shadow-lg);
      animation: scaleIn 0.4s ease;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-logo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      color: var(--accent);
      letter-spacing: 0.12em;
      display: block;
      line-height: 1;
    }

    .auth-logo-sub {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .auth-tabs {
      display: flex;
      gap: 0;
      background: var(--surface-2);
      border-radius: var(--radius-full);
      padding: 0.25rem;
      margin-bottom: 2rem;
      border: 1px solid var(--border);
    }

    .auth-tab {
      flex: 1;
      padding: 0.6rem;
      border-radius: var(--radius-full);
      font-size: 0.875rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
      color: var(--text-muted);
      border: none;
      background: none;
    }

    .auth-tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .auth-divider-text {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .auth-footer-text {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 1.25rem;
    }

    .auth-footer-text a {
      color: var(--accent);
      font-weight: 600;
    }

    .password-group {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.25rem;
      line-height: 1;
    }

    .admin-hint {
      margin-top: 1.5rem;
      padding: 0.875rem 1rem;
      background: var(--surface-2);
      border: 1px dashed var(--border-2);
      border-radius: var(--radius);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }

    .admin-hint strong {
      color: var(--accent);
      display: block;
      margin-bottom: 0.25rem;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 1.75rem 1.25rem;
      }
    }
  </style>
  </head>

  <body>

    <!-- ── Preloader ─────────────────────────────────── -->
    <div id="preloader">
      <div class="preloader-inner">
        <div class="preloader-glow">
          <img src="logo.png" alt="ZENTRA" class="preloader-logo" />
        </div>
        <div class="preloader-brand">ZENTRA</div>
        <div class="preloader-tagline">Wear The Standard</div>
        <div class="preloader-bar-wrap">
          <div class="preloader-bar-fill"></div>
        </div>
        <div class="preloader-dots">
          <span class="preloader-dot"></span>
          <span class="preloader-dot"></span>
          <span class="preloader-dot"></span>
        </div>
      </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
      <div class="nav-inner">
        <a href="index.html" class="nav-logo">
          <img src="logo.png" alt="ZENTRA" class="nav-logo-img" />
        </a>
        <div class="nav-links">
          <a href="index.html" class="nav-link">Home</a>
          <a href="products.html" class="nav-link">Shop</a>
        </div>
        <div class="nav-actions" id="nav-actions"></div>
        <button class="nav-hamburger"
          id="nav-hamburger"><span></span><span></span><span></span></button>
      </div>
    </nav>
    <div class="mobile-menu" id="mobile-menu">
      <a href="index.html" class="mobile-nav-link">Home</a>
      <a href="products.html" class="mobile-nav-link">Shop</a>
    </div>

    <div class="auth-bg"></div>

    <div class="auth-page">
      <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
          <img src="logo.png" alt="ZENTRA" class="auth-logo-img" />
        </div>

        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" id="tab-login-btn"
            onclick="showAuthTab('login')">Login</button>
          <button class="auth-tab" id="tab-register-btn"
            onclick="showAuthTab('register')">Create Account</button>
        </div>

        <!-- Login Form -->
        <div class="auth-form active" id="form-login">
          <form onsubmit="handleLogin(event)">
            <div class="form-group">
              <label class="form-label" for="login-email">Username / Email
                Address <span class="required">*</span></label>
              <input class="form-input" id="login-email" type="text"
                placeholder="Enter your Email"
                autocomplete="username" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="login-password">Password <span
                  class="required">*</span></label>
              <div class="password-group">
                <input class="form-input" id="login-password" type="password"
                  placeholder="••••••••"
                  autocomplete="current-password" required />
                <button type="button" class="password-toggle"
                  onclick="togglePassword('login-password', this)">👁️</button>
              </div>
            </div>
            <div id="login-error" class="form-error"
              style="display:none;margin-bottom:1rem"></div>
            <button type="submit" class="btn btn-primary w-full btn-lg"
              id="login-btn">Sign In →</button>
          </form>

          <div class="auth-footer-text">
            Don't have an account? <a href="#"
              onclick="showAuthTab('register'); return false;">Sign up for
              free</a>
          </div>

          <!-- <div class="admin-hint">
          <strong>🛡️ Admin Access</strong>
          Username: <code>Zantac.in</code> | Password: <code>jabarchand$123</code>
        </div> -->
        </div>

        <!-- Register Form -->
        <div class="auth-form" id="form-register">
          <form onsubmit="handleRegister(event)">
            <div class="form-group">
              <label class="form-label" for="reg-name">Full Name <span
                  class="required">*</span></label>
              <input class="form-input" id="reg-name" type="text"
                placeholder="Your full name" autocomplete="name"
                required />
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-email">Email Address <span
                  class="required">*</span></label>
              <input class="form-input" id="reg-email" type="email"
                placeholder="you@example.com" autocomplete="email"
                required />
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-phone">Mobile Number <span
                  class="required">*</span></label>
              <input class="form-input" id="reg-phone" type="tel"
                placeholder="10-digit mobile number" autocomplete="tel"
                required />
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-password">Password <span
                  class="required">*</span></label>
              <div class="password-group">
                <input class="form-input" id="reg-password" type="password"
                  placeholder="Min. 6 characters"
                  autocomplete="new-password" required />
                <button type="button" class="password-toggle"
                  onclick="togglePassword('reg-password', this)">👁️</button>
              </div>
              <span class="form-hint">At least 6 characters.</span>
            </div>
            <div id="register-error" class="form-error"
              style="display:none;margin-bottom:1rem"></div>
            <button type="submit" class="btn btn-primary w-full btn-lg"
              id="register-btn">Create Account →</button>
          </form>

          <div class="auth-footer-text">
            Already have an account? <a href="#"
              onclick="showAuthTab('login'); return false;">Sign in</a>
          </div>
        </div>
      </div>
    </div>

    <div id="toast-container"></div>
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/preloader.js"></script>
    <script>
    // Redirect if already logged in
    document.addEventListener('DOMContentLoaded', () => {
      const session = Auth.getSession();
      if (session) {
        window.location.href = session.role === 'admin' ? 'admin.html' : 'user-panel.html';
      }

      // Check for #register hash
      if (window.location.hash === '#register') {
        showAuthTab('register');
      }
    });

    function showAuthTab(tab) {
      document.querySelectorAll('.auth-tab').forEach((el) => el.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach((el) => el.classList.remove('active'));
      document.getElementById(`tab-${tab}-btn`)?.classList.add('active');
      document.getElementById(`form-${tab}`)?.classList.add('active');
    }

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');
      const errorEl = document.getElementById('login-error');

      btn.disabled = true;
      btn.textContent = 'Signing in...';
      errorEl.style.display = 'none';

      try {
        await new Promise((r) => setTimeout(r, 300));
      const result = await Auth.login(email, password);
        btn.textContent = 'Sign In →';

        if (result.success) {
          showToast(`Welcome back, ${result.user.name}! 👋`, 'success');
          setTimeout(() => {
            window.location.href = result.user.role === 'admin' ? 'admin.html' : 'user-panel.html';
          }, 800);
        } else {
          errorEl.textContent = '❌ ' + (result.error || 'Invalid credentials or account not found.');
          errorEl.style.display = 'flex';
        }
      } catch (err) {
        console.error('Login Error:', err);
        btn.disabled = false;
        btn.textContent = 'Sign In →';
        errorEl.textContent = '❌ An error occurred during login. Please try again.';
        errorEl.style.display = 'flex';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const phone = document.getElementById('reg-phone').value;
      const password = document.getElementById('reg-password').value;
      const btn = document.getElementById('register-btn');
      const errorEl = document.getElementById('register-error');

      btn.disabled = true;
      btn.textContent = 'Creating account...';
      errorEl.style.display = 'none';

      await new Promise((r) => setTimeout(r, 400));

      const result = await Auth.register(name, email, phone, password);
      btn.disabled = false;
      btn.textContent = 'Create Account →';

      if (result.success) {
        showToast('Account created! Please login now.', 'success');
        setTimeout(() => showAuthTab('login'), 600);
      } else {
        errorEl.textContent = '❌ ' + (result.error || 'Registration failed. Please try again.');
        errorEl.style.display = 'flex';
      }
    }
  </script>
  </body>

</html>
